function setupObstacles(){ice={};vines={};chains={};crates={};const mode=config(level).obstacle;if(mode==='none')return;const count=Math.min(9,2+Math.floor(level/6));const positions=[...Array(N).keys()].sort(()=>Math.random()-.5);positions.slice(0,count).forEach((i,k)=>{const kind=mode==='mixed'?['ice','chains','crates'][k%3]:mode;if(kind==='ice')ice[i]=level>=26?2:1;else if(kind==='chains')chains[i]=1;else if(kind==='crates'){crates[i]=level>=31?2:1;grid[i]=null;delete special[i]}})}
function blocked(i){return !!(chains[i]||crates[i])}
function remainingObstacles(){return Object.keys(ice).length+Object.keys(chains).length+Object.keys(crates).length}
function canMatch(a,b){return adj(a,b)&&!blocked(a)&&!blocked(b)}

function damageObstacles(hit){let changed=0;const around=new Set(hit);hit.forEach(i=>{for(const j of [i-1,i+1,i-W,i+W])if(adj(i,j))around.add(j)});around.forEach(i=>{if(ice[i]){ice[i]--;changed++;if(ice[i]<=0)delete ice[i]}if(chains[i]&&hit.includes(i)){delete chains[i];changed++}if(crates[i]&&!hit.includes(i)){crates[i]--;changed++;if(crates[i]<=0)delete crates[i]}});if(changed)say('障碍清除 +'+changed)}
function useSpecial(i){if(special[i]==null)return null;const kind=special[i];delete special[i];const out=new Set([i]);if(kind==='rainbow'){const count={};grid.forEach(v=>{if(v!=null)count[v]=(count[v]||0)+1});const target=Object.keys(count).sort((a,b)=>count[b]-count[a])[0];grid.forEach((v,j)=>{if(v==target)out.add(j)})}else if(kind==='blast'){const r=Math.floor(i/W),cc=i%W;for(let y=Math.max(0,r-1);y<=Math.min(W-1,r+1);y++)for(let x=Math.max(0,cc-1);x<=Math.min(W-1,cc+1);x++)out.add(y*W+x)}else if(kind==='row'){for(let j=Math.floor(i/W)*W;j<Math.floor(i/W)*W+W;j++)out.add(j)}else{for(let j=i%W;j<N;j+=W)out.add(j)}return [...out]}
function expandSpecial(hit){const out=new Set(hit),queue=[...hit],seen=new Set();while(queue.length){const i=queue.shift();if(seen.has(i))continue;seen.add(i);if(special[i]!=null){const extra=useSpecial(i)||[];extra.forEach(j=>{if(!out.has(j)){out.add(j);queue.push(j)}})}}return [...out]}
function createSpecial(hit,preferred){if(level===1||hit.length<4)return;let best=null;const rows=new Map(),cols=new Map();hit.forEach(i=>{const r=Math.floor(i/W),cc=i%W;if(!rows.has(r))rows.set(r,[]);rows.get(r).push(i);if(!cols.has(cc))cols.set(cc,[]);cols.get(cc).push(i)});for(const [axis,groups] of [['row',rows],['col',cols]])for(const ids of groups.values())if(ids.length>=4&&(!best||ids.length>best.ids.length))best={axis,ids};if(!best)return;const place=best.ids.includes(preferred)?preferred:best.ids[Math.floor(best.ids.length/2)];special[place]=best.ids.length>=6?'rainbow':best.ids.length>=5?'blast':best.axis;return place}
const skins=[['classic','奶油小屋',1,'☕','温暖奶油 · 原木'],['scholar','学院书房',5,'📚','藏蓝书房 · 金色徽章'],['hanfu','国风庭院',10,'🏮','朱红庭院 · 玉色纹样'],['space','星空城堡',15,'🌙','璀璨星空 · 梦幻光环'],['king','黄金王宫',20,'👑','黄金王座 · 宝石华光']];
function skinUnlocked(s){return s[2]===1||unlocked>s[2]||!!stars[s[2]]}
function applySkin(){if(!skins.some(s=>s[0]===skin&&skinUnlocked(s)))skin='classic';document.querySelector('.shell').className='shell skin-'+skin;document.body.dataset.skin=skin;const s=skins.find(x=>x[0]===skin);$('homeCat').innerHTML=catSvg(skin==='king'?5:skin==='space'?2:skin==='hanfu'?4:skin==='scholar'?1:0);if($('board').children.length)draw();$('skinCurrent').textContent='当前装扮：'+s[1];renderSkins()}
function renderSkins(){const box=$('skinGrid');box.innerHTML='';skins.forEach(s=>{const [id,name,need,em,desc]=s,ok=skinUnlocked(s),b=document.createElement('button');b.type='button';b.className='skin-card skin-preview-'+id+(skin===id?' active':'');b.innerHTML='<span class="skin-emblem">'+em+'</span><strong>'+name+'</strong><small>'+desc+'</small><span class="skin-state">'+(ok?(skin===id?'✓ 使用中':'点击穿戴'):'🔒 通关第 '+need+' 关解锁')+'</span>';const preview=document.createElement('div');preview.className='skin-cat-preview';const previous=skin;skin=id;preview.innerHTML=catSvg(id==='king'?5:id==='space'?2:id==='hanfu'?4:id==='scholar'?1:0);skin=previous;b.insertBefore(preview,b.querySelector('strong'));b.onclick=()=>{if(!ok){$('skinCurrent').textContent=name+'：通关第 '+need+' 关后解锁';return}skin=id;try{localStorage.setItem('wangSkin',skin)}catch(e){}applySkin()};box.appendChild(b)})}
function clearGuide(){document.querySelector('.finger-guide')?.remove();$('board').querySelectorAll('.tutorial-target').forEach(e=>e.classList.remove('tutorial-target'))}
function guide(){clearGuide();if(level!==1||!tutorialPair||busy)return;const [a,b]=tutorialPair,els=$('board').children;if(!els[a]||!els[b])return;els[a].classList.add('tutorial-target');els[b].classList.add('tutorial-target');const wrap=document.querySelector('.boardwrap'),ra=els[a].getBoundingClientRect(),rb=els[b].getBoundingClientRect(),rw=wrap.getBoundingClientRect();const x=ra.left+ra.width/2-rw.left,y=ra.top+ra.height/2-rw.top,dx=rb.left-ra.left,dy=rb.top-ra.top;const finger=document.createElement('div');finger.className='finger-guide';finger.textContent='👆';finger.style.left=x+'px';finger.style.top=y+'px';finger.style.setProperty('--gx',dx+'px');finger.style.setProperty('--gy',dy+'px');wrap.appendChild(finger)}
function cheer(chain,count){const msg=chain>=3?'简直不可思议！':chain===2?'好棒好棒！':count>=5?'太厉害啦！':count>=4?'漂亮！':'不错哦！';if(chain>=2||count>=4){say(msg);$('status').textContent='✦ '+msg}}
function beep(f=550,d=.09){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function say(s){$('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',2300)}function swap(a,b){[grid[a],grid[b]]=[grid[b],grid[a]];[special[a],special[b]]=[special[b],special[a]];if(special[a]==null)delete special[a];if(special[b]==null)delete special[b]}function adj(a,b){return a>=0&&b>=0&&a<N&&b<N&&Math.abs(Math.floor(a/W)-Math.floor(b/W))+Math.abs(a%W-b%W)===1}function matches(){const s=new Set;for(let r=0;r<W;r++){for(let c=0;c<W;){let e=c+1;while(e<W&&grid[r*W+e]!=null&&grid[r*W+e]===grid[r*W+c])e++;if(e-c>=3)for(let k=c;k<e;k++)s.add(r*W+k);c=e}}for(let c=0;c<W;c++){for(let r=0;r<W;){let e=r+1;while(e<W&&grid[e*W+c]!=null&&grid[e*W+c]===grid[r*W+c])e++;if(e-r>=3)for(let k=r;k<e;k++)s.add(k*W+c);r=e}}return [...s]}
function findMove(){for(let a=0;a<N;a++)for(const b of [a+1,a+W]){if(!canMatch(a,b))continue;swap(a,b);const ok=matches().length>0;swap(a,b);if(ok)return[a,b]}return null}
function fresh(){special={};for(let tries=0;tries<200;tries++){grid=Array.from({length:N},()=>rnd(config(level).types));for(let i=0;i<N;i++){let guard=0;while(((i%W>=2&&grid[i]===grid[i-1]&&grid[i]===grid[i-2])||(i>=W*2&&grid[i]===grid[i-W]&&grid[i]===grid[i-2*W]))&&guard++<30)grid[i]=rnd(config(level).types)}if(findMove()){setupObstacles();if(!findMove()){chains={};crates={};ice={}}if(level>=8&&level%4===0){const free=[...Array(N).keys()].filter(i=>grid[i]!=null&&!blocked(i));if(free.length)special[free[rnd(free.length)]]=level%8===0?'blast':'row'}return}}grid=Array.from({length:N},()=>rnd(config(level).types));setupObstacles();say('棋盘已重新生成，请继续挑战')}
function draw(spawn=[]){const frag=document.createDocumentFragment();grid.forEach((v,i)=>{const el=document.createElement('button');el.type='button';el.className='tile t'+v+(spawn.includes(i)?' spawn':'');el.dataset.i=i;el.setAttribute('aria-label',cats[v].name+'，第'+(Math.floor(i/W)+1)+'行第'+(i%W+1)+'列');el.innerHTML=catSvg(v)+(special[i]==='blast'?'<span class="special-mark blast-mark">✹</span>':special[i]==='rainbow'?'<span class="special-mark rainbow-mark">✦</span>':special[i]==='row'?'<span class="special-mark">↔</span>':special[i]==='col'?'<span class="special-mark">↕</span>':'');if(special[i])el.classList.add('special-tile');if(ice[i]){el.classList.add('ice-tile');el.insertAdjacentHTML('beforeend','<span class="obstacle-mark">❄</span>')}if(chains[i]){el.classList.add('chain-tile');el.insertAdjacentHTML('beforeend','<span class="obstacle-mark">⛓</span>')}if(crates[i]){el.classList.add('crate-tile');el.innerHTML='<span class="crate-symbol">📦</span><small>'+crates[i]+'</small>'}frag.appendChild(el)});$('board').replaceChildren(frag);if(level===1&&!busy)requestAnimationFrame(guide);$('level').textContent=String(level).padStart(2,'0');$('score').textContent=score;$('moves').textContent=moves;$('goal').textContent='目标 '+config(level).goal.toLocaleString()+' 分';const cfg=config(level);$('mission').textContent=cfg.cat<0?'本关任务：达到目标积分':'双重任务：积分达标，并收集 '+cats[cfg.cat].name.split('·')[0]+' '+collected+' / '+cfg.need+' 只';const remaining=remainingObstacles();if(remaining)$('mission').textContent='本关任务：清除障碍 '+remaining+' 处';$('progress').style.width=Math.min(100,score/config(level).goal*100)+'%';updateTools();$('coinStatus').textContent='金币 '+coins;rewardInfo();drawBoss()}
function updateTools(){for(const k of ['hint','hammer','shuffle']){$(k+'Count').textContent='剩余 '+tools[k]+' 次';$(k).disabled=busy||tools[k]<=0;$(k).classList.toggle('armed',k==='hammer'&&armed)}}
function levels(){const nav=$('levels');nav.innerHTML='';for(let i=1;i<=50;i++){const b=document.createElement('button');b.className='levelchip'+(i===level?' active':'')+(i>unlocked?' locked':'');b.innerHTML=String(i).padStart(2,'0')+(stars[i]?'<span class="star">'+'★'.repeat(stars[i])+'</span>':'');b.title=i>unlocked?'尚未解锁':'第'+i+'关';b.disabled=i>unlocked;b.onclick=()=>{if(busy)return;level=i;reset()};nav.appendChild(b)}nav.querySelector('.active')?.scrollIntoView({block:'nearest',inline:'center'})}
function particles(indices,points){for(const i of indices){const el=$('board').children[i];if(!el)continue;const r=el.getBoundingClientRect();for(let k=0;k<6;k++){const p=document.createElement('i');p.className='spark';p.style.left=r.left+r.width/2+'px';p.style.top=r.top+r.height/2+'px';p.style.background=['#e5b36e','#c86d66','#8cabc4','#a0bf8b','#ae94c9'][rnd(5)];p.style.setProperty('--dx',rnd(130)-65+'px');p.style.setProperty('--dy',rnd(130)-65+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),780)}}if(indices.length){const r=$('board').children[indices[0]].getBoundingClientRect(),f=document.createElement('div');f.className='float';f.style.left=r.left+'px';f.style.top=r.top+'px';f.textContent='+'+points+' ✦';document.body.appendChild(f);setTimeout(()=>f.remove(),930)}}
function gravity(){const born=[];const nextSpecial={};const nextIce={},nextVines={},nextChains={};for(let c=0;c<W;c++){let bottom=W-1;while(bottom>=0){if(crates[bottom*W+c]){grid[bottom*W+c]=null;bottom--;continue}let top=bottom;while(top>=0&&!crates[top*W+c])top--;const keep=[];for(let r=bottom;r>top;r--)if(grid[r*W+c]!=null)keep.push({v:grid[r*W+c],sp:special[r*W+c],ice:ice[r*W+c],chain:chains[r*W+c]});for(let r=bottom;r>top;r--){const k=bottom-r;grid[r*W+c]=k<keep.length?keep[k].v:rnd(config(level).types);if(k<keep.length){if(keep[k].sp)nextSpecial[r*W+c]=keep[k].sp;if(keep[k].ice)nextIce[r*W+c]=keep[k].ice;if(keep[k].chain)nextChains[r*W+c]=keep[k].chain}else born.push(r*W+c)}bottom=top-1}}special=nextSpecial;ice=nextIce;chains=nextChains;vines=nextVines;return born}
async function cascade(first,preferred=-1){let hit=first,chain=0,t=token;while(hit.length&&chain<20){chain++;const made=createSpecial(hit,preferred);hit=expandSpecial(hit);if(made!=null)hit=hit.filter(i=>i!==made);preferred=-1;if(!hit.length)break;damageObstacles(hit);if(isBoss()){bossHp=Math.max(0,bossHp-hit.length*55*(chain>1?2:1));drawBoss()}const points=hit.length*55*Math.min(chain,2);score+=points;const cfg=config(level);if(cfg.cat>=0)collected+=hit.filter(i=>grid[i]===cfg.cat).length;$('status').textContent=chain>1?'✦ '+chain+' 连击':'漂亮的一消';particles(hit,points);cheer(chain,hit.length);hit.forEach(i=>$('board').children[i]?.classList.add('pop'));beep(540+chain*100,.14);await wait(290);if(t!==token)return false;hit.forEach(i=>{grid[i]=null;delete special[i]});draw(gravity());await wait(260);if(t!==token)return false;hit=matches()}return true}
async function play(a,b){if(busy||!canMatch(a,b))return;if(level===1&&tutorialPair&&!(a===tutorialPair[0]&&b===tutorialPair[1]||a===tutorialPair[1]&&b===tutorialPair[0])){say('跟着手指提示，滑动发光的猫咪哦');guide();return}clearGuide();busy=true;updateTools();const t=token;swap(a,b);draw();beep(420);await wait(170);if(t!==token)return;let hit=matches();const triggered=useSpecial(a)||useSpecial(b);if(triggered)hit=[...new Set([...hit,...triggered])];if(!hit.length){swap(a,b);draw();beep(220,.15);busy=false;updateTools();return}moves--;if(!await cascade(hit,b))return;if(level===1){score=Math.max(score,config(1).goal);draw();finish(true);return}checkEnd()}
function checkEnd(){draw();if((level>=11&&!isBoss()||score>=config(level).goal&&collected>=config(level).need)&&remainingObstacles()===0&&(!isBoss()||bossHp<=0)){finish(true);return}if(moves<=0){finish(false);return}if(!findMove()){fresh();draw();say('棋盘已自动重新排列')}busy=false;updateTools()}
function finish(win){clearGuide();busy=true;armed=false;const star=win?(moves>=Math.ceil(config(level).moves*.35)?3:moves>=Math.ceil(config(level).moves*.12)?2:1):0;if(win){if(!stars[level])giveCoins(15+level*3);if(level%5===0&&!claimed[level]){claimed[level]=true;giveCoins(80+level*5)}stars[level]=Math.max(stars[level]||0,star);unlocked=Math.max(unlocked,Math.min(50,level+1));try{localStorage.setItem('wangCheeseUnlocked',unlocked);localStorage.setItem('wangCheeseStars',JSON.stringify(stars))}catch(e){}}levels();renderSkins();renderMap();if(win&&level===1){$('status').textContent='教学完成！进入第 2 关';say('太棒了！第一关完成，正在进入第二关…');const t=token;setTimeout(()=>{if(t!==token||level!==1)return;level=2;reset()},1100);return}$('overlay').classList.add('show');$('medal').textContent=win?'🏆':'🐾';$('modalTitle').textContent=win?'第 '+level+' 关完成！':'挑战未完成';$('modalText').innerHTML=win?`获得 ${score.toLocaleString()} 分<br><span style="color:#d4a24d;font-size:24px">${'★'.repeat(star)}${'☆'.repeat(3-star)}</span><br>${level===50?'恭喜！50 关全部通关！' :'新的关卡已经解锁'+(level%5===0?' · 宝箱奖励已领取！':'')}`:`本次 ${score.toLocaleString()} / ${config(level).goal.toLocaleString()} 分${config(level).need?'<br>猫咪收集 '+collected+' / '+config(level).need+' 只':''}<br>试试提示、猫爪锤和洗牌道具吧！`;$('modalAction').textContent=win&&level<50?'挑战下一关 →':win?'再玩一次':'重新挑战';$('modalAction').onclick=()=>{if(win&&level<50)level++;$('overlay').classList.remove('show');reset()};$('modalOther').style.display=win&&level===50?'inline-block':'none';$('modalOther').onclick=()=>{$('overlay').classList.remove('show');level=1;reset()};beep(win?900:250,.25)}
function reset(){token++;score=0;collected=0;special={};ice={};vines={};chains={};crates={};bossHp=isBoss()?bossMax():0;moves=config(level).moves;busy=false;armed=false;down=null;tools={hint:3,hammer:2,shuffle:2};$('status').textContent=level===1?'跟随手指滑动猫咪':'准备出发 ✦';$('toast').textContent='';fresh();tutorialPair=level===1?findMove():null;draw();levels();if(level===1)requestAnimationFrame(guide)}
$('hint').onclick=()=>{if(level===1){guide();say('跟着手指方向滑动发光的猫咪');return}if(busy||tools.hint<=0)return;const pair=findMove();if(!pair){fresh();draw();say('已经重新排列棋盘');return}tools.hint--;updateTools();pair.forEach(i=>$('board').children[i]?.classList.add('hinted'));say('试着交换发光的两只猫咪 ✧');beep(750,.12)};
$('hammer').onclick=()=>{if(level===1){say('完成新手教学后解锁道具');return}if(busy||tools.hammer<=0)return;armed=!armed;updateTools();say(armed?'请选择一只猫咪，直接移除它（不消耗步数）':'已取消猫爪锤')};
async function hammerAt(i){if(busy||!armed||tools.hammer<=0)return;armed=false;tools.hammer--;busy=true;updateTools();particles([i],80);score+=80;$('board').children[i]?.classList.add('pop');beep(720,.16);const t=token;await wait(300);if(t!==token)return;grid[i]=null;delete special[i];draw(gravity());await wait(260);if(t!==token)return;const hit=matches();if(hit.length){if(!await cascade(hit))return}checkEnd()}
$('shuffle').onclick=()=>{if(level===1){say('完成新手教学后解锁道具');return}if(busy||tools.shuffle<=0)return;tools.shuffle--;fresh();draw([...Array(N).keys()]);say('猫咪们换好位置啦！');beep(620,.16)};
$('startGame').onclick=()=>{$('home').classList.add('hidden');$('adventureMap').classList.remove('open');$('wardrobe').classList.remove('open');if(!$('board').children.length){try{reset()}catch(err){$('home').classList.remove('hidden');alert('游戏初始化失败，请刷新页面重试')}}if(level===1)requestAnimationFrame(guide)};$('backHome').onclick=()=>{$('home').classList.remove('hidden');$('wardrobe').classList.remove('open');$('homeProgress').textContent='已解锁至第 '+unlocked+' 关';renderSkins()};$('openSkins').onclick=()=>{$('wardrobe').classList.toggle('open');renderSkins()};$('homeSound').onclick=()=>{sound=!sound;$('homeSound').textContent='音效：'+(sound?'开':'关')};$('buyHint').onclick=()=>{if(coins<30){say('金币不足，继续闯关赚金币');return}giveCoins(-30);tools.hint++;updateTools();say('获得一次提示')};$('buyHammer').onclick=()=>{if(coins<50){say('金币不足，继续闯关赚金币');return}giveCoins(-50);tools.hammer++;updateTools();say('获得一个猫爪锤')};$('openMap').onclick=()=>{$('adventureMap').classList.toggle('open');$('wardrobe').classList.remove('open');renderMap()};const board=$('board');board.addEventListener('pointerdown',e=>{if(busy)return;const el=e.target.closest('.tile');if(!el)return;const i=Number(el.dataset.i);if(blocked(i)&&!armed){say('猫咪被障碍挡住了');return}if(armed){hammerAt(i);return}down={i,x:e.clientX,y:e.clientY};el.classList.add('selected');try{board.setPointerCapture(e.pointerId)}catch(_){}});board.addEventListener('pointerup',e=>{if(!down)return;const {i,x,y}=down;down=null;board.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));const dx=e.clientX-x,dy=e.clientY-y;if(Math.hypot(dx,dy)<14)return;const b=Math.abs(dx)>Math.abs(dy)?i+(dx>0?1:-1):i+(dy>0?W:-W);if(canMatch(i,b))play(i,b)});board.addEventListener('pointercancel',()=>{down=null;board.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'))});$('restart').onclick=()=>{if(confirm('重新开始本关？本关的积分和道具会重置。'))reset()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫ 音效开启':'♫ 音效关闭'};try{reset();applySkin();rewardInfo();renderMap();$('homeProgress').textContent='已解锁至第 '+unlocked+' 关'}catch(err){console.error('游戏启动异常',err);$('homeProgress').textContent='游戏准备中，点击开始游戏重试';} })();
</script></body></html>
