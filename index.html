</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">THE CAT COLLECTION · 20 LEVELS · V4</div><h1 class="brand">王芝士消消乐</h1><p class="subtitle">收集芝士能量，和六只猫咪一起挑战 20 关。</p></div><div class="logo" id="logo"></div></header><nav class="levelstrip" id="levels" aria-label="关卡选择"></nav><section class="summary"><div class="stat"><label>当前关卡</label><b id="level">01</b></div><div class="stat"><label>芝士积分</label><b id="score">0</b></div><div class="stat"><label>剩余步数</label><b id="moves">20</b></div></section><div class="goal"><span id="goal">目标 0 分</span><span id="status">准备出发 ✦</span></div><div class="progress"><div id="progress"></div></div><div class="boardwrap"><div class="board" id="board" aria-label="七乘七猫咪消除棋盘"></div></div><div class="tools"><button class="tool" id="hint"><span class="toolicon">✧</span>提示<small id="hintCount">剩余 3 次</small></button><button class="tool" id="hammer"><span class="toolicon">🔨</span>猫爪锤<small id="hammerCount">剩余 2 次</small></button><button class="tool" id="shuffle"><span class="toolicon">⤨</span>洗牌<small id="shuffleCount">剩余 2 次</small></button></div><div class="toast" id="toast" aria-live="polite"></div><div class="foot"><button class="subbutton" id="restart">↻ 重玩本关</button><button class="subbutton" id="sound">♫ 音效开启</button></div><p class="hinttext">按住猫咪滑向相邻格子交换 · 连成 3 只或更多即可消除<br>第一关跟随手指完成教学后自动进入第二关 · 第 2 关起需多次消除 · 进度自动保存</p></main><div class="overlay" id="overlay"><div class="modal"><div class="medal" id="medal">🏆</div><h2 id="modalTitle"></h2><p id="modalText"></p><button class="primary" id="modalAction"></button><button class="secondary" id="modalOther" style="display:none">返回选关</button></div></div><script>
(()=>{'use strict';const W=7,N=49,$=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n);let level=1,unlocked=1,stars={},grid=[],score=0,moves=0,busy=false,armed=false,down=null,token=0,sound=true,audio=null,tools={hint:3,hammer:2,shuffle:2},toastTimer;
// Each character uses its own ear silhouette, markings, eyes and accessories, not OS-dependent emoji.
const cats=[{name:'橘猫·芝士',fur:'#e99b55',inner:'#f5c29b',ink:'#71432f',mark:'#c97639',eye:'round',acc:'stripe'}, {name:'蓝猫·博士',fur:'#8cabc4',inner:'#e2b2bf',ink:'#344b69',mark:'#617f9e',eye:'glasses',acc:'bow'}, {name:'紫猫·星星',fur:'#ae94c9',inner:'#eac2dc',ink:'#53426d',mark:'#8866b2',eye:'sleep',acc:'star'}, {name:'绿猫·抹茶',fur:'#9dbf87',inner:'#e5bdad',ink:'#3e6648',mark:'#719a61',eye:'wide',acc:'leaf'}, {name:'粉猫·桃桃',fur:'#e6a3a8',inner:'#f6d0c6',ink:'#79434f',mark:'#c87b87',eye:'wink',acc:'heart'}, {name:'金猫·国王',fur:'#d7b76b',inner:'#f7d4ac',ink:'#6d5730',mark:'#b28c3e',eye:'happy',acc:'crown'}];
function catSvg(t){const c=cats[t];let eyes='';switch(c.eye){case 'round':eyes='<ellipse cx="35" cy="53" rx="3.3" ry="5" fill="'+c.ink+'"/><ellipse cx="65" cy="53" rx="3.3" ry="5" fill="'+c.ink+'"/>';break;case 'glasses':eyes='<circle cx="35" cy="53" r="10" fill="none" stroke="'+c.ink+'" stroke-width="3.5"/><circle cx="65" cy="53" r="10" fill="none" stroke="'+c.ink+'" stroke-width="3.5"/><path d="M45 51Q50 48 55 51" stroke="'+c.ink+'" stroke-width="3" fill="none"/><circle cx="35" cy="53" r="2.5" fill="'+c.ink+'"/><circle cx="65" cy="53" r="2.5" fill="'+c.ink+'"/>';break;case 'sleep':eyes='<path d="M27 55q8 -9 16 0M57 55q8 -9 16 0" fill="none" stroke="'+c.ink+'" stroke-width="4" stroke-linecap="round"/>';break;case 'wide':eyes='<ellipse cx="35" cy="53" rx="7" ry="9" fill="#fff"/><ellipse cx="65" cy="53" rx="7" ry="9" fill="#fff"/><ellipse cx="36" cy="54" rx="3.6" ry="6" fill="'+c.ink+'"/><ellipse cx="66" cy="54" rx="3.6" ry="6" fill="'+c.ink+'"/>';break;case 'wink':eyes='<path d="M27 55q8 -9 16 0" fill="none" stroke="'+c.ink+'" stroke-width="4" stroke-linecap="round"/><ellipse cx="65" cy="53" rx="3.5" ry="5.5" fill="'+c.ink+'"/>';break;case 'happy':eyes='<path d="M27 56q8 -11 16 0M57 56q8 -11 16 0" fill="none" stroke="'+c.ink+'" stroke-width="4" stroke-linecap="round"/>';break}let accessory='';if(c.acc==='stripe')accessory='<path d="M42 30l-3 12M50 27v14M58 30l3 12" stroke="'+c.mark+'" stroke-width="5" stroke-linecap="round"/>';if(c.acc==='bow')accessory='<path d="M36 22L20 12Q17 31 36 29L50 25L64 29Q83 31 80 12L64 22Z" fill="#f5d39a" stroke="'+c.ink+'" stroke-width="2"/><circle cx="50" cy="25" r="6" fill="#e9b76b"/>';if(c.acc==='star')accessory='<path d="M50 13l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#ffe9a3" stroke="#fff7d7" stroke-width="2"/>';if(c.acc==='leaf')accessory='<path d="M48 30Q42 10 65 12Q65 30 48 30Z" fill="#467d5b"/><path d="M48 30L61 17" stroke="#bfe4a8" stroke-width="2"/>';if(c.acc==='heart')accessory='<path d="M50 37C26 22 30 10 43 14Q49 16 50 21Q57 10 66 16Q78 27 50 37" fill="#fff0f0"/>';if(c.acc==='crown')accessory='<path d="M28 31L24 10L40 21L50 6L60 21L76 10L72 31Z" fill="#f8df91" stroke="#ae8244" stroke-width="3"/><circle cx="50" cy="24" r="3.5" fill="#ca7c6b"/>';return `<svg viewBox="0 0 100 100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M14 48L13 15Q14 8 21 14L35 28Q50 22 65 28L79 14Q86 8 87 15L86 48Q94 82 67 87Q50 93 33 87Q6 82 14 48Z" fill="${c.fur}" stroke="${c.ink}" stroke-width="3.3" stroke-linejoin="round"/><path d="M20 38L20 21L33 34M80 38L80 21L67 34" fill="${c.inner}" opacity=".9"/><ellipse cx="50" cy="73" rx="16" ry="11" fill="#fff7ec" opacity=".78"/>${accessory}${eyes}<path d="M45 65l5 4 5-4Z" fill="${c.ink}"/><path d="M50 69v4m0 0q-6 7-12 0m12 0q6 7 12 0" fill="none" stroke="${c.ink}" stroke-width="2.4" stroke-linecap="round"/><path d="M24 68L8 64M25 75L9 78M76 68L92 64M75 75L91 78" stroke="${c.ink}" stroke-width="2" opacity=".7" stroke-linecap="round"/></svg>`}
$('logo').innerHTML=catSvg(0);try{unlocked=Math.max(1,Math.min(20,Number(localStorage.getItem('wangCheeseUnlocked'))||1));stars=JSON.parse(localStorage.getItem('wangCheeseStars')||'{}')}catch(e){}level=unlocked;
// Later levels have more cat types, tighter move budgets and higher score requirements.
const config=l=>l===1?{types:4,moves:1,goal:195}:{types:l<=3?5:6,moves:Math.max(14,21-Math.floor((l-2)/3)),goal:2100+(l-2)*245+Math.floor((l-2)/5)*240};
let tutorialPair=null;
function clearGuide(){document.querySelector('.finger-guide')?.remove();$('board').querySelectorAll('.tutorial-target').forEach(e=>e.classList.remove('tutorial-target'))}
function guide(){clearGuide();if(level!==1||!tutorialPair||busy)return;const [a,b]=tutorialPair,els=$('board').children;if(!els[a]||!els[b])return;els[a].classList.add('tutorial-target');els[b].classList.add('tutorial-target');const wrap=document.querySelector('.boardwrap'),ra=els[a].getBoundingClientRect(),rb=els[b].getBoundingClientRect(),rw=wrap.getBoundingClientRect();const x=ra.left+ra.width/2-rw.left,y=ra.top+ra.height/2-rw.top,dx=rb.left-ra.left,dy=rb.top-ra.top;const finger=document.createElement('div');finger.className='finger-guide';finger.textContent='👆';finger.style.left=x+'px';finger.style.top=y+'px';finger.style.setProperty('--gx',dx+'px');finger.style.setProperty('--gy',dy+'px');wrap.appendChild(finger)}
function beep(f=550,d=.09){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function say(s){$('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',2300)}function swap(a,b){[grid[a],grid[b]]=[grid[b],grid[a]]}function adj(a,b){return a>=0&&b>=0&&a<N&&b<N&&Math.abs(Math.floor(a/W)-Math.floor(b/W))+Math.abs(a%W-b%W)===1}function matches(){const s=new Set;for(let r=0;r<W;r++){for(let c=0;c<W;){let e=c+1;while(e<W&&grid[r*W+e]!=null&&grid[r*W+e]===grid[r*W+c])e++;if(e-c>=3)for(let k=c;k<e;k++)s.add(r*W+k);c=e}}for(let c=0;c<W;c++){for(let r=0;r<W;){let e=r+1;while(e<W&&grid[e*W+c]!=null&&grid[e*W+c]===grid[r*W+c])e++;if(e-r>=3)for(let k=r;k<e;k++)s.add(k*W+c);r=e}}return [...s]}
function findMove(){for(let a=0;a<N;a++)for(const b of [a+1,a+W]){if(!adj(a,b))continue;swap(a,b);const ok=matches().length>0;swap(a,b);if(ok)return[a,b]}return null}
function fresh(){for(let tries=0;tries<200;tries++){grid=Array.from({length:N},()=>rnd(config(level).types));for(let i=0;i<N;i++){let guard=0;while(((i%W>=2&&grid[i]===grid[i-1]&&grid[i]===grid[i-2])||(i>=W*2&&grid[i]===grid[i-W]&&grid[i]===grid[i-2*W]))&&guard++<30)grid[i]=rnd(config(level).types)}if(findMove())return}throw Error('无法生成棋盘')}
function draw(spawn=[]){const frag=document.createDocumentFragment();grid.forEach((v,i)=>{const el=document.createElement('button');el.type='button';el.className='tile t'+v+(spawn.includes(i)?' spawn':'');el.dataset.i=i;el.setAttribute('aria-label',cats[v].name+'，第'+(Math.floor(i/W)+1)+'行第'+(i%W+1)+'列');el.innerHTML=catSvg(v);frag.appendChild(el)});$('board').replaceChildren(frag);if(level===1&&!busy)requestAnimationFrame(guide);$('level').textContent=String(level).padStart(2,'0');$('score').textContent=score;$('moves').textContent=moves;$('goal').textContent='目标 '+config(level).goal.toLocaleString()+' 芝士积分';$('progress').style.width=Math.min(100,score/config(level).goal*100)+'%';updateTools()}
function updateTools(){for(const k of ['hint','hammer','shuffle']){$(k+'Count').textContent='剩余 '+tools[k]+' 次';$(k).disabled=busy||tools[k]<=0;$(k).classList.toggle('armed',k==='hammer'&&armed)}}
function levels(){const nav=$('levels');nav.innerHTML='';for(let i=1;i<=20;i++){const b=document.createElement('button');b.className='levelchip'+(i===level?' active':'')+(i>unlocked?' locked':'');b.innerHTML=String(i).padStart(2,'0')+(stars[i]?'<span class="star">'+'★'.repeat(stars[i])+'</span>':'');b.title=i>unlocked?'尚未解锁':'第'+i+'关';b.disabled=i>unlocked;b.onclick=()=>{if(busy)return;level=i;reset()};nav.appendChild(b)}nav.querySelector('.active')?.scrollIntoView({block:'nearest',inline:'center'})}
function particles(indices,points){for(const i of indices){const el=$('board').children[i];if(!el)continue;const r=el.getBoundingClientRect();for(let k=0;k<6;k++){const p=document.createElement('i');p.className='spark';p.style.left=r.left+r.width/2+'px';p.style.top=r.top+r.height/2+'px';p.style.background=['#e5b36e','#c86d66','#8cabc4','#a0bf8b','#ae94c9'][rnd(5)];p.style.setProperty('--dx',rnd(130)-65+'px');p.style.setProperty('--dy',rnd(130)-65+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),780)}}if(indices.length){const r=$('board').children[indices[0]].getBoundingClientRect(),f=document.createElement('div');f.className='float';f.style.left=r.left+'px';f.style.top=r.top+'px';f.textContent='+'+points+' ✦';document.body.appendChild(f);setTimeout(()=>f.remove(),930)}}
function gravity(){const born=[];for(let c=0;c<W;c++){const keep=[];for(let r=W-1;r>=0;r--)if(grid[r*W+c]!=null)keep.push(grid[r*W+c]);for(let r=W-1;r>=0;r--){const k=W-1-r;grid[r*W+c]=k<keep.length?keep[k]:rnd(config(level).types);if(k>=keep.length)born.push(r*W+c)}}return born}
async function cascade(first){let hit=first,chain=0,t=token;while(hit.length&&chain<20){chain++;const points=hit.length*55*Math.min(chain,2);score+=points;$('status').textContent=chain>1?'✦ '+chain+' 连击':'漂亮的一消';particles(hit,points);hit.forEach(i=>$('board').children[i]?.classList.add('pop'));beep(540+chain*100,.14);await wait(290);if(t!==token)return false;hit.forEach(i=>grid[i]=null);draw(gravity());await wait(260);if(t!==token)return false;hit=matches()}return true}
async function play(a,b){if(busy||!adj(a,b))return;if(level===1&&tutorialPair&&!(a===tutorialPair[0]&&b===tutorialPair[1]||a===tutorialPair[1]&&b===tutorialPair[0])){say('跟着手指提示，滑动发光的猫咪哦');guide();return}clearGuide();busy=true;updateTools();const t=token;swap(a,b);draw();beep(420);await wait(170);if(t!==token)return;let hit=matches();if(!hit.length){swap(a,b);draw();beep(220,.15);busy=false;updateTools();return}moves--;if(!await cascade(hit))return;if(level===1){score=Math.max(score,config(1).goal);draw();finish(true);return}checkEnd()}
function checkEnd(){draw();if(score>=config(level).goal){finish(true);return}if(moves<=0){finish(false);return}if(!findMove()){fresh();draw();say('棋盘已自动重新排列')}busy=false;updateTools()}
function finish(win){clearGuide();busy=true;armed=false;const star=win?(moves>=Math.ceil(config(level).moves*.35)?3:moves>=Math.ceil(config(level).moves*.12)?2:1):0;if(win){stars[level]=Math.max(stars[level]||0,star);unlocked=Math.max(unlocked,Math.min(20,level+1));try{localStorage.setItem('wangCheeseUnlocked',unlocked);localStorage.setItem('wangCheeseStars',JSON.stringify(stars))}catch(e){}}levels();if(win&&level===1){$('status').textContent='教学完成！进入第 2 关';say('太棒了！第一关完成，正在进入第二关…');const t=token;setTimeout(()=>{if(t!==token||level!==1)return;level=2;reset()},1100);return}$('overlay').classList.add('show');$('medal').textContent=win?'🏆':'🐾';$('modalTitle').textContent=win?'第 '+level+' 关完成！':'芝士能量不足';$('modalText').innerHTML=win?`获得 ${score.toLocaleString()} 分<br><span style="color:#d4a24d;font-size:24px">${'★'.repeat(star)}${'☆'.repeat(3-star)}</span><br>${level===20?'恭喜！20 关全部通关！':'新的关卡已经解锁'}`:`本次 ${score.toLocaleString()} / ${config(level).goal.toLocaleString()} 分<br>试试提示、猫爪锤和洗牌道具吧！`;$('modalAction').textContent=win&&level<20?'挑战下一关 →':win?'再玩一次':'重新挑战';$('modalAction').onclick=()=>{if(win&&level<20)level++;$('overlay').classList.remove('show');reset()};$('modalOther').style.display=win&&level===20?'inline-block':'none';$('modalOther').onclick=()=>{$('overlay').classList.remove('show');level=1;reset()};beep(win?900:250,.25)}
function reset(){token++;score=0;moves=config(level).moves;busy=false;armed=false;down=null;tools={hint:3,hammer:2,shuffle:2};$('status').textContent=level===1?'跟随手指滑动猫咪':'准备出发 ✦';$('toast').textContent='';fresh();tutorialPair=level===1?findMove():null;draw();levels();if(level===1)requestAnimationFrame(guide)}
$('hint').onclick=()=>{if(level===1){guide();say('跟着手指方向滑动发光的猫咪');return}if(busy||tools.hint<=0)return;const pair=findMove();if(!pair){fresh();draw();say('已经重新排列棋盘');return}tools.hint--;updateTools();pair.forEach(i=>$('board').children[i]?.classList.add('hinted'));say('试着交换发光的两只猫咪 ✧');beep(750,.12)};
$('hammer').onclick=()=>{if(level===1){say('完成新手教学后解锁道具');return}if(busy||tools.hammer<=0)return;armed=!armed;updateTools();say(armed?'请选择一只猫咪，直接移除它（不消耗步数）':'已取消猫爪锤')};
async function hammerAt(i){if(busy||!armed||tools.hammer<=0)return;armed=false;tools.hammer--;busy=true;updateTools();particles([i],80);score+=80;$('board').children[i]?.classList.add('pop');beep(720,.16);const t=token;await wait(300);if(t!==token)return;grid[i]=null;draw(gravity());await wait(260);if(t!==token)return;const hit=matches();if(hit.length){if(!await cascade(hit))return}checkEnd()}
$('shuffle').onclick=()=>{if(level===1){say('完成新手教学后解锁道具');return}if(busy||tools.shuffle<=0)return;tools.shuffle--;fresh();draw([...Array(N).keys()]);say('猫咪们换好位置啦！');beep(620,.16)};
const board=$('board');board.addEventListener('pointerdown',e=>{if(busy)return;const el=e.target.closest('.tile');if(!el)return;const i=Number(el.dataset.i);if(armed){hammerAt(i);return}down={i,x:e.clientX,y:e.clientY};el.classList.add('selected');try{board.setPointerCapture(e.pointerId)}catch(_){}});board.addEventListener('pointerup',e=>{if(!down)return;const {i,x,y}=down;down=null;board.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));const dx=e.clientX-x,dy=e.clientY-y;if(Math.hypot(dx,dy)<14)return;const b=Math.abs(dx)>Math.abs(dy)?i+(dx>0?1:-1):i+(dy>0?W:-W);if(adj(i,b))play(i,b)});board.addEventListener('pointercancel',()=>{down=null;board.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'))});$('restart').onclick=()=>{if(confirm('重新开始本关？本关的积分和道具会重置。'))reset()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫ 音效开启':'♫ 音效关闭'};reset();})();
</script></body></html>
